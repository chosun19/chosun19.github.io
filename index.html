<script>
// Floating particles
(function() {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight * 3;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = -(Math.random() * 0.3 + 0.1);
            this.opacity = Math.random() * 0.3 + 0.05;
            this.fadeSpeed = Math.random() * 0.003 + 0.001;
            this.growing = Math.random() > 0.5;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.growing) {
                this.opacity += this.fadeSpeed;
                if (this.opacity >= 0.35) this.growing = false;
            } else {
                this.opacity -= this.fadeSpeed;
                if (this.opacity <= 0.02) this.reset();
            }
            if (this.y < -10 || this.x < -10 || this.x > w + 10) this.reset();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201, 169, 110, ${this.opacity})`;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201, 169, 110, ${this.opacity * 0.15})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
})();
</script>

                                <p>모바일에서는 카드를 탭해 주세요. 담당 업무와 주요 성과를 확인할 수 있습니다.</p>
                            </div>
                        </div>
                        <div className="projects-list">
                            {projects.map((p, idx) => (
                                <div
                                    key={idx}
                                    className="project-card fade-in"
                                    onClick={() => selectProject(idx)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectProject(idx); }
                                    }}
                                    role="button"
                                    aria-describedby="career-guide"
                                    tabIndex={0}
                                    title={`${p.company} 상세 경력 보기`}
                                    style={{transitionDelay: `${Math.min(idx * 0.06, 0.4)}s`}}
                                >
                                    <div className="project-card-left">
                                        <div className="project-card-icon" style={{fontSize: '36px', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '56px', height: '56px', background: 'var(--bg-secondary)', borderRadius: '12px', overflow: 'hidden'}}>
                                            <img
                                                src={p.logoUrl}
                                                alt={`${p.company} 로고`}
                                                style={{width: '100%', height: '100%', objectFit: 'contain', padding: '8px'}}
                                                onError={(e) => {
                                                    e.currentTarget.style.display = 'none';
                                                    const fallback = e.currentTarget.nextElementSibling;
                                                    if (fallback) fallback.style.display = 'flex';
                                                }}
                                            />
                                            <span style={{display: 'none', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%'}}>
                                                {'\u{1F6E1}'}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="project-card-body">
                                        <div className="project-card-header"><div><h3 className="project-card-title">{p.title}</h3><div className="project-card-role">{p.role} · {p.industry}{p.employmentType ? ` · ${p.employmentType}` : ''}</div></div><div className="project-card-period">{p.period}</div></div>
                                        <p className="project-card-desc">{p.description}</p>
                                        <div className="project-card-footer"><div className="project-card-tags">{p.tech.slice(0, 6).map((t, i) => <span key={i} className="project-card-tag">{t}</span>)}{p.tech.length > 6 && <span className="project-card-tag">+{p.tech.length - 6}</span>}</div><div className="project-card-metrics">{p.achievements.map((a, i) => (<div key={i} className="project-card-metric"><div className="project-card-metric-value">{a.value}</div><div className="project-card-metric-label">{a.label}</div></div>))}</div></div>
                                        <div className="project-card-clickhint">상세 경력 보기 &rarr;</div>
                                    </div>
                                    <div className="project-card-arrow">&rarr;</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>

                <div className="section-divider"><div className="section-divider-line"></div><div className="section-divider-diamond"></div><div className="section-divider-line"></div></div>

                <section className="section" id="tech">
                    <div className="section-container">
                        <div className="section-header fade-in"><div><div className="section-tag">Expertise</div><h2 className="section-title">업무 역량과 활용 기술</h2></div></div>
                        <div className="skills-grid">
                            {Object.entries(techStack).map(([cat, items], idx) => (
                                <div key={idx} className="skill-card fade-in" style={{transitionDelay: `${Math.min(idx * 0.04, 0.3)}s`}}><div className="skill-name"><div className="skill-dot"></div>{cat}</div><div className="skill-badges">{items.map((item, i) => <span key={i} className="skill-badge">{item}</span>)}</div></div>
                            ))}
                        </div>
                    </div>
                </section>

                <div className="section-divider"><div className="section-divider-line"></div><div className="section-divider-diamond"></div><div className="section-divider-line"></div></div>

                <section className="section" id="certs">
                    <div className="section-container">
                        <div className="section-header fade-in"><div><div className="section-tag">Certifications</div><h2 className="section-title">자격·교육·어학 이력</h2></div></div>
                        <div className="projects-list">
                            {certifications.map((cert, idx) => (
                                <div key={idx} className="project-card fade-in" style={{transitionDelay: `${Math.min(idx * 0.06, 0.4)}s`, cursor: 'default'}}>
                                    <div className="project-card-left"><div style={{fontSize: '36px', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '56px', height: '56px', background: 'var(--bg-secondary)', borderRadius: '12px'}}>{cert.type === 'lang' ? '\u{1F30D}' : '\u{1F3C5}'}</div></div>
                                    <div className="project-card-body"><div className="project-card-header"><div><h3 className="project-card-title">{cert.name}</h3><div className="project-card-role">{cert.org}</div><div className="credential-meta"><span className="credential-status">{cert.expires ? (new Date(cert.expires + 'T23:59:59').getTime() < Date.now() ? '유효기간 만료' : '취득') : cert.status}</span>{cert.expires && <span>유효기간 {cert.expires.replace(/-/g, '.')}까지</span>}</div></div><div className="project-card-period">취득·이수 {cert.date}</div></div></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>

                <div className="section-divider"><div className="section-divider-line"></div><div className="section-divider-diamond"></div><div className="section-divider-line"></div></div>

                <section className="section" id="education">
                    <div className="section-container">
                        <div className="section-header fade-in"><div><div className="section-tag">Education</div><h2 className="section-title">학력 · 교육</h2></div></div>
                        <div className="projects-list">
                            {education.map((edu, idx) => (
                                <div key={idx} className="project-card fade-in" style={{transitionDelay: `${Math.min(idx * 0.06, 0.4)}s`, cursor: 'default'}}>
                                    <div className="project-card-left"><div style={{fontSize: '36px', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '56px', height: '56px', background: 'var(--bg-secondary)', borderRadius: '12px'}}>{edu.type === '교육수료' ? '\u{1F4DA}' : '\u{1F393}'}</div></div>
                                    <div className="project-card-body">
                                        <div className="project-card-header"><div><h3 className="project-card-title">{edu.school}</h3><div className="project-card-role">{edu.major} &middot; {edu.type}</div></div><div className="project-card-period">{edu.period}</div></div>
                                        {edu.gpa && <div className="project-card-footer" style={{marginTop: '8px'}}><div className="project-card-tags"><span className="project-card-tag">학점 {edu.gpa}</span></div></div>}
                                    </div>
                                </div>
                            ))}
                            <div className="project-card fade-in" style={{cursor: 'default'}}>
                                <div className="project-card-left">
                                    <div className="project-card-icon" style={{display: 'flex', alignItems: 'center', justifyContent: 'center', width: '56px', height: '56px', color: 'var(--gold)'}}>
                                        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true">
                                            <path d="M12 3 4.5 6v5.5c0 4.5 3 7.6 7.5 9.5 4.5-1.9 7.5-5 7.5-9.5V6L12 3Z" />
                                            <path d="m8.5 11.5 2.3 2.3 4.7-4.8" />
                                        </svg>
                                    </div>
                                </div>
                                <div className="project-card-body">
                                    <div className="project-card-header">
                                        <div><h3 className="project-card-title">병역</h3><div className="project-card-role">의무경찰 수경 · 만기전역</div></div>
                                        <div className="project-card-period">2008.05.08 ~ 2010.03.27</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div className="section-divider"><div className="section-divider-line"></div><div className="section-divider-diamond"></div><div className="section-divider-line"></div></div>

                <section className="section" id="contact">
                    <div className="section-container">
                        <div className="section-header-full fade-in"><div className="section-tag">Get In Touch</div><h2 className="section-title">연락처</h2></div>
                        <div className="contact-grid"><a href="mailto:chosun19@naver.com" className="contact-card fade-in"><span className="contact-emoji">&#9993;</span><div className="contact-type">Email</div><div className="contact-info contact-info-eq">chosun19<br className="mobile-only-br" />@naver.com</div></a><a href="tel:010-9990-5692" className="contact-card fade-in" style={{transitionDelay: '0.1s'}}><span className="contact-emoji">&#128241;</span><div className="contact-type">Phone</div><div className="contact-info contact-info-eq">010-9990-5692</div></a><div className="contact-card fade-in" style={{transitionDelay: '0.2s'}}><span className="contact-emoji">&#128205;</span><div className="contact-type">Address</div><div className="contact-info">서울 구로구<br className="mobile-only-br" />신도림동</div></div></div>
                    </div>
                </section>

                <footer><div className="section-container"><p className="footer-text">&copy; 2026 Kiwoong Hong. All rights reserved.</p></div></footer>
                </>
                )}
            </>
        );
    };

    ReactDOM.render(<Portfolio />, document.getElementById('root'));
</script>
</body>
</html>
